name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-devices-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # scoped to this job so we can create/upload releases
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies (incl. dev group for the exporter regression test)
        run: uv sync --frozen --all-groups
      - name: Publish devices.json to Release
        # Delegates test fence, JSON build, sanity check, and gh release
        # create/upload to scripts/publish-devices-release.sh — one source
        # of truth for local (TAG=v0.1.0 scripts/publish-devices-release.sh)
        # and CI. Idempotent on re-run for the same tag.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/publish-devices-release.sh
