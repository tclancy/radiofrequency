name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-devices-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # scoped to this job so we can create/upload releases
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build devices.json
        run: uv run python scripts/export_web_devices.py > devices.json
      - name: Sanity check that JSON parses and has lights
        run: |
          python -c "
          import json, sys
          data = json.load(open('devices.json'))
          if 'lights' not in data or not data['lights']:
              print('devices.json has no lights', file=sys.stderr)
              sys.exit(1)
          print(f\"devices.json: {len(data['lights'])} lights\")
          "
      - name: Publish devices.json as release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create the release if it doesn't already exist (idempotent on re-run).
          gh release create "$TAG" --generate-notes --title "$TAG" || true
          # Upload (or replace) devices.json on the release.
          gh release upload "$TAG" devices.json --clobber
