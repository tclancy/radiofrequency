name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-devices-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # scoped to this job so we can create/upload releases
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies (incl. dev group for the exporter regression test)
        run: uv sync --frozen --all-groups
      - name: Run exporter regression fence
        # Guards against the tag-push silent-success class-of-bug — the exporter's
        # existing test asserts shape/sort/serializability, so any subtle break
        # (empty commands dict, wrong encoding filter, etc.) fails here rather
        # than shipping a valid-JSON-but-wrong-shape artifact.
        run: uv run pytest tests/test_export_web_devices.py -x
      - name: Build devices.json
        run: uv run python scripts/export_web_devices.py > devices.json
      - name: Sanity check that JSON parses and has lights
        run: |
          uv run python - <<'PY'
          import json, sys
          data = json.load(open("devices.json"))
          lights = data.get("lights")
          if not lights:
              print("devices.json has no lights", file=sys.stderr)
              sys.exit(1)
          bad = [l for l in lights if not (l.get("unit") and l.get("commands"))]
          if bad:
              print(f"devices.json entries missing unit/commands: {bad}", file=sys.stderr)
              sys.exit(1)
          print(f"devices.json: {len(lights)} lights")
          PY
      - name: Publish devices.json as release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create the release if it doesn't already exist (idempotent on re-run).
          gh release create "$TAG" --generate-notes --title "$TAG" || true
          # Upload (or replace) devices.json on the release.
          gh release upload "$TAG" devices.json --clobber
